<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .ai { fill: #eef2ff; stroke: #818cf8; }
      .det { fill: #f0fdf4; stroke: #86efac; }
      .title { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .step { font-size: 11px; font-weight: 700; fill: #6366f1; letter-spacing: .06em; }
      .body { font-size: 11.5px; fill: #334155; }
      .lane { font-size: 13px; font-weight: 700; fill: #475569; letter-spacing: .08em; }
      .edge { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 5 4; }
      .note { font-size: 11px; fill: #64748b; }
    </style>
  </defs>
  <rect width="1280" height="700" fill="#f8fafc"/>
  <text x="32" y="40" font-size="22" font-weight="700" fill="#0f172a">Site Cloner Agent — architecture</text>
  <text x="32" y="62" class="note">URL → Analysis → Generation → Validation → Preview → Scoring/Refinement, then natural-language Modification with validation and rollback</text>

  <!-- Clone lane -->
  <text x="32" y="102" class="lane">CLONE PIPELINE</text>

  <rect x="32" y="116" width="110" height="64" rx="10" class="box"/>
  <text x="87" y="144" text-anchor="middle" class="title">Website</text>
  <text x="87" y="162" text-anchor="middle" class="title">URL</text>

  <rect x="170" y="116" width="200" height="230" rx="10" class="box det"/>
  <text x="184" y="138" class="step">1 · ANALYZE</text>
  <text x="184" y="158" class="title">Headless Chromium</text>
  <text x="184" y="180" class="body">• Render at 1440px, scroll, settle</text>
  <text x="184" y="198" class="body">  animations, skip overlays</text>
  <text x="184" y="216" class="body">• Detect sections + kind</text>
  <text x="184" y="234" class="body">• Simplified DOM + computed</text>
  <text x="184" y="252" class="body">  styles → compact outline</text>
  <text x="184" y="270" class="body">• Download images / SVGs</text>
  <text x="184" y="288" class="body">• Design tokens (colours,</text>
  <text x="184" y="306" class="body">  fonts, radius, container)</text>
  <text x="184" y="324" class="body">• Re-measure at 390px + shots</text>

  <rect x="398" y="116" width="200" height="230" rx="10" class="box ai"/>
  <text x="412" y="138" class="step">2 · GENERATE</text>
  <text x="412" y="158" class="title">One component / section</text>
  <text x="412" y="180" class="body">• Prompt = outline + tokens +</text>
  <text x="412" y="198" class="body">  responsive notes + crop</text>
  <text x="412" y="216" class="body">  screenshot (vision LLM)</text>
  <text x="412" y="234" class="body">• Sections run in parallel</text>
  <text x="412" y="252" class="body">• Tailwind v4 theme tokens</text>
  <text x="412" y="270" class="body">• Deterministic sanitizer</text>
  <text x="412" y="288" class="body">• No key / failure →</text>
  <text x="412" y="306" class="body">  deterministic generator</text>
  <text x="412" y="324" class="body">  (always compiles)</text>

  <rect x="626" y="116" width="200" height="230" rx="10" class="box det"/>
  <text x="640" y="138" class="step">3 · VALIDATE &amp; REPAIR</text>
  <text x="640" y="158" class="title">Self-healing loop</text>
  <text x="640" y="180" class="body">• tsc --noEmit + static lint</text>
  <text x="640" y="198" class="body">• Errors → LLM repair of that</text>
  <text x="640" y="216" class="body">  file only (≤ 2 rounds)</text>
  <text x="640" y="234" class="body">• Runtime check in Chromium:</text>
  <text x="640" y="252" class="body">  HTTP 500, page errors,</text>
  <text x="640" y="270" class="body">  mapped to component</text>
  <text x="640" y="288" class="body">• Still failing → fallback</text>
  <text x="640" y="306" class="body">  component for that section</text>

  <rect x="854" y="116" width="170" height="230" rx="10" class="box"/>
  <text x="868" y="138" class="step">4 · PREVIEW</text>
  <text x="868" y="158" class="title">next dev</text>
  <text x="868" y="180" class="body">• One dev server per site</text>
  <text x="868" y="198" class="body">• Studio iframe:</text>
  <text x="868" y="216" class="body">  desktop / tablet / mobile</text>
  <text x="868" y="234" class="body">• Code viewer</text>
  <text x="868" y="252" class="body">• Hot reload after edits</text>

  <rect x="1052" y="116" width="196" height="230" rx="10" class="box ai"/>
  <text x="1066" y="138" class="step">5 · SCORE &amp; REFINE</text>
  <text x="1066" y="158" class="title">Visual accuracy</text>
  <text x="1066" y="180" class="body">• Screenshot clone, crop</text>
  <text x="1066" y="198" class="body">  each section, pixelmatch</text>
  <text x="1066" y="216" class="body">  vs original → score</text>
  <text x="1066" y="234" class="body">• Worst sections → vision</text>
  <text x="1066" y="252" class="body">  LLM sees original AND</text>
  <text x="1066" y="270" class="body">  current render</text>
  <text x="1066" y="288" class="body">• Keep only if it compiles</text>
  <text x="1066" y="306" class="body">  and the score improves</text>

  <path d="M142,148 L166,148" class="edge"/>
  <path d="M370,231 L394,231" class="edge"/>
  <path d="M598,231 L622,231" class="edge"/>
  <path d="M826,231 L850,231" class="edge"/>
  <path d="M1024,231 L1048,231" class="edge"/>

  <!-- Output -->
  <rect x="398" y="372" width="626" height="62" rx="10" class="box"/>
  <text x="414" y="396" class="title">Generated Next.js 15 + TypeScript + Tailwind v4 project  (generated/&lt;site&gt;/)</text>
  <text x="414" y="418" class="body">components/&lt;Section&gt;.tsx · app/page.tsx (built from manifest) · app/globals.css (@theme tokens) · public/assets · clone.json (manifest, history, usage)</text>
  <path d="M1150,346 L1150,403 L1028,403" class="edge"/>

  <!-- Modify lane -->
  <text x="32" y="484" class="lane">MODIFICATION LOOP</text>

  <rect x="32" y="498" width="150" height="120" rx="10" class="box"/>
  <text x="46" y="522" class="title">User prompt</text>
  <text x="46" y="544" class="body">"Change the primary</text>
  <text x="46" y="562" class="body">  color to blue"</text>
  <text x="46" y="580" class="body">"Add a testimonials</text>
  <text x="46" y="598" class="body">  section"</text>

  <rect x="210" y="498" width="230" height="160" rx="10" class="box ai"/>
  <text x="224" y="520" class="step">PLAN</text>
  <text x="224" y="540" class="title">Rules first, then fast LLM</text>
  <text x="224" y="562" class="body">• Simple edits parsed by rules</text>
  <text x="224" y="580" class="body">  (0 tokens)</text>
  <text x="224" y="598" class="body">• Otherwise cheap model returns</text>
  <text x="224" y="616" class="body">  a JSON plan: theme, remove,</text>
  <text x="224" y="634" class="body">  sticky, edit, add, order</text>

  <rect x="468" y="498" width="260" height="160" rx="10" class="box"/>
  <text x="482" y="520" class="step">APPLY</text>
  <text x="482" y="540" class="title">Smallest possible change</text>
  <text x="482" y="562" class="body">• theme / remove / sticky / order:</text>
  <text x="482" y="580" class="body">  manifest + tokens, no LLM</text>
  <text x="482" y="598" class="body">• edit: main LLM rewrites only the</text>
  <text x="482" y="616" class="body">  targeted component</text>
  <text x="482" y="634" class="body">• add: new component in site style</text>

  <rect x="756" y="498" width="250" height="160" rx="10" class="box det"/>
  <text x="770" y="520" class="step">VALIDATE</text>
  <text x="770" y="540" class="title">Same repair loop</text>
  <text x="770" y="562" class="body">• tsc + runtime check on the</text>
  <text x="770" y="580" class="body">  touched files only</text>
  <text x="770" y="598" class="body">• Failure → automatic rollback</text>
  <text x="770" y="616" class="body">  to the pre-edit snapshot</text>
  <text x="770" y="634" class="body">• Success → snapshot kept for Undo</text>

  <rect x="1034" y="498" width="214" height="160" rx="10" class="box"/>
  <text x="1048" y="520" class="step">RESULT</text>
  <text x="1048" y="540" class="title">Hot-reloaded preview</text>
  <text x="1048" y="562" class="body">• History + one-click undo</text>
  <text x="1048" y="580" class="body">• Token/cost counter</text>
  <text x="1048" y="598" class="body">• Disk cache: identical</text>
  <text x="1048" y="616" class="body">  prompts cost nothing</text>

  <path d="M182,558 L206,558" class="edge"/>
  <path d="M440,578 L464,578" class="edge"/>
  <path d="M728,578 L752,578" class="edge"/>
  <path d="M1006,578 L1030,578" class="edge"/>
  <path d="M540,434 L540,494" class="edge dashed"/>
  <text x="548" y="468" class="note">edits the generated project</text>

  <rect x="32" y="672" width="14" height="14" rx="3" class="ai"/>
  <text x="52" y="684" class="note">uses an LLM (any OpenAI-compatible provider)</text>
  <rect x="330" y="672" width="14" height="14" rx="3" class="det"/>
  <text x="350" y="684" class="note">deterministic (no tokens)</text>
</svg>
